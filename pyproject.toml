[project]
name = "aviation-accident-analysis"
version = "0.1.0"
description = "Aviation accident report parsing and prompt generation service using MCP."
readme = "README.md"
authors = [
    { name = "hzy9981" }
]
license = { text = "MIT" }
repository = "https://github.com/hzy9981/aviation-accident-analysis"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.46",
    "botocore>=1.43.46",
    "fastmcp>=3.4.4",
    "graphrag>=3.1.0",
    "neo4j>=6.2.0",
    "pandas>=2.3.3",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = [
    "mcp_server.py",
    "prompts/*.txt",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "mcp_server.py",
    "prompts/*.txt",
    "README.md",
    "pyproject.toml",
]

[project.scripts]
aviation-mcp = "mcp_server:mcp.run"
